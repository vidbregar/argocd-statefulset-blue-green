apiVersion: v1
kind: Service
metadata:
  name: {{ include "example.name" . }}
  labels:
    {{- include "example.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "example.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.port }}
      targetPort: {{ .Values.port }}
